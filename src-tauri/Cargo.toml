[package]
name = "openmirko"
version = "0.1.0"
description = "OpenMirko — open-source, local-first infinite canvas whiteboard"
authors = ["Stefan Malinović"]
edition = "2021"

[lib]
name = "openmirko_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
